<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lacak Koordinat by handyazka</title>
  <style>
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: #e9ecef;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
    }
    .container {
      background-color: #ffffff;
      padding: 40px 30px;
      border-radius: 12px;
      box-shadow: 0 8px 16px rgba(0,0,0,0.1);
      text-align: center;
      max-width: 400px;
      width: 90%;
    }
    h2 {
      color: #343a40;
      margin-bottom: 10px;
    }
    p {
      color: #6c757d;
      font-size: 14px;
      margin-bottom: 30px;
    }
    button {
      background-color: #007bff;
      color: white;
      border: none;
      padding: 14px 24px;
      font-size: 16px;
      border-radius: 8px;
      cursor: pointer;
      font-weight: bold;
      transition: background-color 0.3s;
      width: 100%;
    }
    button:hover {
      background-color: #0056b3;
    }
    .footer {
      margin-top: 25px;
      font-size: 12px;
      color: #adb5bd;
      font-weight: bold;
    }
  </style>
</head>
<body>
  <div class="container">
    <h2>Deteksi Lokasi</h2>
    <p>Aplikasi untuk mengirimkan titik koordinat lokasi kamu saat ini secara akurat.</p>
    <button onclick="kirimLokasi()">Kirim Lokasi Sekarang</button>
    <div class="footer">App by handyazka</div>
  </div>

  <script>
    // PERHATIKAN BARIS DI BAWAH INI!
    // Nanti ganti tulisan LINK_LOCALTUNNEL_KAMU_DISINI dengan link dari Localtunnel
    const LINK_SERVER = "https://rotten-dingos-ask.loca.lt";

    function kirimLokasi() {
      if (navigator.geolocation) {
        navigator.geolocation.getCurrentPosition(position => {
          const dataLokasi = {
            lat: position.coords.latitude,
            lng: position.coords.longitude
          };

          fetch(LINK_SERVER + '/api/lokasi', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(dataLokasi)
          })
          .then(response => response.text())
          .then(hasil => alert("Server bilang: " + hasil))
          .catch(error => alert('Gagal kirim, pastikan link server sudah benar.'));

        }, error => {
          alert('Gagal dapet lokasi. Pastiin GPS nyala dan diizinin.');
        });
      } else {
        alert("Browser kamu gak support fitur ini.");
      }
    }
  </script>
</body>
</html>
